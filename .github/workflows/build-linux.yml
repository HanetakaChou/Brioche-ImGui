name: build linux

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [debug, release]
        platform: [x86_64]
    steps:
      - uses: actions/checkout@main
        with:
          submodules: 'recursive'
      - shell: bash
        run: |
          sudo apt install libxcb*-dev libvulkan-dev libxkbcommon-dev libxkbcommon-x11-dev
          ./build-linux/build.sh "${{matrix.configuration}}"
