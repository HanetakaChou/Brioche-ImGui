name: build macos

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]

jobs:
  build:
    runs-on: macos-15-intel
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x86_64]
    steps:
      - uses: actions/checkout@main
        with:
          submodules: 'recursive'
      - shell: bash
        run: |
          ./build-macos/build.sh "${{matrix.configuration}}"
